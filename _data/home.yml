cards:
  title: Welcome to Oslo, Norway
  description: |
    The University of Oslo Natural History Museum and the Norwegian Biodiversity Information Center, on behalf of Norway, are pleased to host the 33rd meeting (GB33) of the GBIF Governing Board in Oslo, Norway.  

    Please visit the [programme page](/programme) for a full description of the individual events taking place.  

    GB33 will take place the week after the Biodiversity Information Standards (TDWG) 2026 conference. The venues for TDWG 2026 and GB33 will be within walking distance of each other in downtown Oslo. Visit the [TDWG 2026 conference page](https://www.tdwg.org/conferences/2026/) for details.

    Oslo is a nature-rich city ranked high as a sustainable city. With only a local metro ticket, you can travel to a national park (Østmarka), protected forest and river reserves, and experience the marine ecosystems of the inner Oslofjord. Oslo is also a good starting point for traveling to experience other parts of Norway's diverse nature.





